<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site em construção - GP Streaming</title>
  <link rel="icon" href="https://i.imgur.com/fXTgHar.png">
  <style>
    :root {
      --bg: #0d0d0f;
      --text: #f2f2f2;
      --muted: #8a8a93;
      --accent: #e5e5e5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      width: min(70vw, 350px);
      max-height: 55vh;
      object-fit: contain;
    }

    h1 {
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <img class="logo" src="https://i.imgur.com/0q1ACxx.png" alt="Logo">
  <h1>Site em construção</h1>
</body>
</html>
